<!DOCTYPE html>
<html>
    <head>
        <title>My calculator</title>
        <link rel="stylesheet" href="Styles.CSS">
    </head>
    <body>
        <div id="main">
            <div class="calculator">
            <textarea id="display"readonly>0</textarea>

            <button class="btn" data-action="clear">C</button>
            <button class="btn" data-value="/">&divide;</button>
            <button class="btn" data-value="*">&times;</button>
            <button class="shany" data-action="back">&#x232B</button>

            <button class="lyn" data-value="7">7</button>
            <button class="lyn" data-value="8">8</button>
            <button class="lyn" data-value="9">9</button>
            <button class="shany" data-value="-">&minus;</button>

            <button class="lyn" data-value="4">4</button>
            <button class="lyn" data-value="5">5</button>
            <button class="lyn" data-value="6">6</button>
            <button class="shany" data-value="+">&plus;</button>

            <button class="lyn" data-value="1">1</button>
            <button class="lyn" data-value="2">2</button>
            <button class="lyn" data-value="3">3</button>
            <button class="shany" data-action="equals">&equals;</button>

            <button class="btn" data-value="%">&percnt;</button>
            <button class="lyn" data-value="0">0</button>
            <button class="btn" data-value=".">&period;</button>
            <button class="shany" data-action="sqrt">&radic;</button>
         </div>
        </div>
    </body>
</html>
